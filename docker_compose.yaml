version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whale_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whale_acoustics}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounts init scripts to run sequentially in alphabetical order on first run
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-whale_acoustics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: